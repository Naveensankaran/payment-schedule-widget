<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Schedule</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #000; margin: 0; padding: 10px; }
  #status { padding: 20px; text-align: center; color: #555; }
  #error { padding: 16px; background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; border-radius: 4px; margin: 10px 0; display: none; }
  table { border-collapse: collapse; width: 100%; }
  td { border: 1px solid #000; padding: 4px; }
  .noborder td { border: none; padding: 0; }
  .center { text-align: center; }
  .right { text-align: right; }
  .bold { font-weight: bold; }
  .section-title { text-align: center; padding: 6px 0; font-weight: bold; }
  .section-title.dark { background: #7f7f7f; color: #fff; }
  .grand-total { border-top: 3px double #000; border-bottom: 3px double #000; text-align: center; padding: 8px 4px; font-size: 13px; font-weight: bold; }
  #printBtn { margin-bottom: 10px; padding: 6px 14px; cursor: pointer; }
  @media print { #printBtn { display: none; } }
</style>
</head>
<body>

<div id="status">Loading payment schedule…</div>
<div id="error"></div>
<button id="printBtn" style="display:none" onclick="window.print()">Print</button>
<div id="content" style="font-family: Verdana, Arial, Helvetica, sans-serif; width:1000px; max-width:100%; margin:0 auto"></div>

<script>
function fmt(n) {
  if (n === null || n === undefined || n === "" || isNaN(n)) return "";
  return Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function showError(msg) {
  document.getElementById("status").style.display = "none";
  const el = document.getElementById("error");
  el.style.display = "block";
  el.textContent = msg;
}

function render(r) {
  const c = r.customer, u = r.unit, rows = r.rows, tA = r.totalsA, sB = r.sectionB, sC = r.sectionC;

  const rowsHtml = rows.map(row => `
    <tr>
      <td class="center">${row.no}</td>
      <td>${row.date || ""}</td>
      <td${row.no === 11 ? ' class="bold"' : ''}>${row.desc}</td>
      <td class="center">${row.uvPercent}%</td>
      <td class="right">${fmt(row.amount)}</td>
      <td class="center">${row.tdsPercent}%</td>
      <td class="right">${fmt(row.tdsAmount)}</td>
      <td class="right">${fmt(row.developerAmount)}</td>
      <td class="center">${row.gstPercent}%</td>
      <td class="right">${fmt(row.gstAmount)}</td>
      <td class="right">${fmt(row.payableAmount)}</td>
    </tr>`).join("");

  const html = `
    <table>
      <tr>
        <td colspan="3" class="center" style="padding:6px 0">
          <span style="font-size:15px;font-weight:bold;color:#0070c0">PAYMENT SCHEDULE - CUM - COST SHEET</span>
        </td>
      </tr>
      <tr>
        <td colspan="3" class="center" style="padding:4px 0">
          <span style="font-size:12px;font-weight:bold;color:#ff0000">PHASE - I (BLOCKS - A, B, C, D, E, F, K, L, M, N &amp; O)</span>
        </td>
      </tr>
    </table>

    <table class="noborder">
      <tr>
        <td width="18%" style="border:1px solid #000;font-weight:bold">DATE OF BOOKING</td>
        <td width="2%" style="border:1px solid #000" class="center">:</td>
        <td width="30%" style="border:1px solid #000">&nbsp;${c.bookingDate || ""}</td>
        <td width="30%" style="border:1px solid #000;font-weight:bold" class="center">Built-up Area (in Sq.Ft.)</td>
        <td width="2%" style="border:1px solid #000" class="center">:</td>
        <td width="18%" style="border:1px solid #000;font-weight:bold" class="right">${fmt(u.builtUpArea)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">NAME OF THE CUSTOMER</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000">${c.name || ""}</td>
        <td style="border:1px solid #000;font-weight:bold" class="center">Differential Built-up Area (in Sq.Ft.)</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000;font-weight:bold" class="right">${fmt(u.diffBuiltUpArea)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">CONTACT NUMBER (1)</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000">${c.phone || ""}</td>
        <td style="border:1px solid #000;font-weight:bold" class="center">Total Saleable Built-up Area (in Sq.Ft.)</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000;font-weight:bold" class="right">${fmt(u.totalSaleableArea)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">CONTACT NUMBER (2)</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000">${c.phone2 || ""}</td>
        <td style="border:1px solid #000">Basic Price for Built-up Area</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="right">${fmt(u.basicPriceBuiltup)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">EMAIL ADDRESS (1)</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000">${c.email || ""}</td>
        <td style="border:1px solid #000">Basic Price for Differential Built-up Area</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="right">${fmt(u.basicPriceDiff)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">EMAIL ADDRESS (2)</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000">${c.email2 || ""}</td>
        <td style="border:1px solid #000">Charges for Floor Rise</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="right">${fmt(u.floorRiseCharge)}</td>
      </tr>
      <tr>
        <td colspan="3" style="border:1px solid #000;font-weight:bold" class="center">APARTMENT DETAILS</td>
        <td style="border:1px solid #000">Charges for Facing</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="right">${fmt(u.facingCharge)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">Block</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="center">${u.block || ""}</td>
        <td style="border:1px solid #000">Charges for Corner Preference</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="right">${fmt(u.cornerCharge)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">Floor</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="center">${u.floor || ""}</td>
        <td style="border:1px solid #000">Charges for View</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="right">${fmt(u.viewCharge)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">Apartment No.</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="center">${u.apartmentNo || ""}</td>
        <td style="border:1px solid #000">Charges for Shifting</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="right">${fmt(u.shiftingCharge)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">UDS</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="center">${u.uds || ""}</td>
        <td style="border:1px solid #000;font-weight:bold" class="center">BASIC UNIT VALUE</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000;font-weight:bold" class="right">${fmt(u.basicUnitValue)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">CAR PARKING(S)</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="center">${u.parking || ""}</td>
        <td style="border:1px solid #000">Charges for Amenities</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="right">${fmt(u.amenitiesCharge)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">Facing</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="center">${u.facing || ""}</td>
        <td colspan="3" style="border:1px solid #000">Charges for Gas Pipe-line Installation &nbsp;:&nbsp; ${fmt(u.gasPipeline)}</td>
      </tr>
      <tr>
        <td style="border:1px solid #000;font-weight:bold">Type</td>
        <td style="border:1px solid #000" class="center">:</td>
        <td style="border:1px solid #000" class="center">${u.type || ""}</td>
        <td colspan="3" style="border:1px solid #000;font-weight:bold" class="center">
          TOTAL UNIT VALUE (INCL. AMENITIES &amp; GAS PIPE-LINE) &nbsp;:&nbsp; Rs. ${fmt(u.totalUnitValue)}
        </td>
      </tr>
    </table>

    <div class="section-title" style="font-size:20px;border:1px solid #000;border-top:none">PAYMENT SCHEDULE</div>

    <table style="font-size:10.5px">
      <tr class="bold center">
        <td width="4%">S.No</td><td width="7%">DATE</td><td width="27%">Description of Payments</td>
        <td width="5%">UV %</td><td width="10%">Instalment Amount Payable</td><td width="5%">TDS</td>
        <td width="9%">TDS to be Remitted through Traces of Purchaser(s)</td>
        <td width="10%">Amount payable to Developer (excl. TDS)</td><td width="5%">GST %</td>
        <td width="8%">GST Amount Payable to Developer on each instalment</td>
        <td width="10%">Instalment Amount payable to Developer (incl. GST, excl. TDS)</td>
      </tr>
      ${rowsHtml}
      <tr class="bold center">
        <td colspan="3">TOTAL - A</td>
        <td>100%</td>
        <td class="right">${fmt(tA.amount)}</td>
        <td></td>
        <td class="right">${fmt(tA.tdsAmount)}</td>
        <td class="right">${fmt(tA.developerAmount)}</td>
        <td></td>
        <td class="right">${fmt(tA.gstAmount)}</td>
        <td class="right">${fmt(tA.payableAmount)}</td>
      </tr>
    </table>

    <div class="section-title" style="border:1px solid #000;border-top:none">AMOUNT PAYABLE AT THE TIME OF REGISTRATION OF APARTMENT</div>
    <table style="font-size:10.5px">
      <tr>
        <td width="6%" class="center">12</td>
        <td width="50%">Legal and Documentation Charges</td>
        <td width="14%" class="right">${fmt(sB.legalCharge)}</td>
        <td width="8%" class="center">18%</td>
        <td width="10%" class="right">${fmt(sB.legalGst)}</td>
        <td width="12%" class="right bold">${fmt(sB.total)}</td>
      </tr>
      <tr class="bold">
        <td colspan="5">TOTAL - B (Excluding Registration / Stamp Duty &amp; Mutation Charges)</td>
        <td class="right">${fmt(sB.total)}</td>
      </tr>
    </table>

    <div class="section-title" style="border:1px solid #000;border-top:none">AMOUNTS PAYABLE AT THE TIME OF HANDING OVER OF APARTMENT</div>
    <table style="font-size:10.5px">
      <tr class="bold center">
        <td width="6%">Sl.No</td><td width="50%">Particulars</td>
        <td width="14%">Amount Payable</td><td width="8%">GST %</td>
        <td width="10%">GST Amount</td><td width="12%">Amount Payable incl. GST (in INR)</td>
      </tr>
      <tr>
        <td class="center">13</td>
        <td>Maintenance for 2 years @ Rs. 96/- per Sq.ft &amp; GST @ 18%</td>
        <td class="right">${fmt(sC.maintenance)}</td>
        <td class="center">18%</td>
        <td class="right">${fmt(sC.maintenanceGst)}</td>
        <td class="right">${fmt(sC.maintenanceTotal)}</td>
      </tr>
      <tr>
        <td class="center">14</td><td>Corpus Fund</td>
        <td class="right">${fmt(sC.corpus)}</td><td class="center">-</td><td class="right">-</td>
        <td class="right">${fmt(sC.corpus)}</td>
      </tr>
      <tr>
        <td class="center">15</td><td>Non-refundable Caution Deposit</td>
        <td class="right">${fmt(sC.nonRefDeposit)}</td><td class="center">-</td><td class="right">-</td>
        <td class="right">${fmt(sC.nonRefDeposit)}</td>
      </tr>
      <tr>
        <td class="center">16</td><td>Refundable Caution Deposit</td>
        <td class="right">${fmt(sC.refDeposit)}</td><td class="center">-</td><td class="right">-</td>
        <td class="right">${fmt(sC.refDeposit)}</td>
      </tr>
      <tr class="bold center">
        <td colspan="2">TOTAL - C</td>
        <td class="right">${fmt(sC.totalAmount)}</td>
        <td></td>
        <td class="right">${fmt(sC.totalGst)}</td>
        <td class="right">${fmt(sC.total)}</td>
      </tr>
    </table>

    <div class="grand-total">
      GRAND TOTAL (A + B + C) - (INCLUDING TDS / EXCLUDING REGISTRATION, STAMPDUTY &amp; MUTATION CHARGES)&nbsp;:&nbsp;
      Rs. ${fmt(r.grandTotal)}
    </div>

    <div class="section-title dark">OTHER TERMS &amp; CONDITIONS</div>
    <table style="font-size:10px">
      <tr><td width="3%" class="center">1</td><td>The purchaser/s shall issue post dated cheques for all installments as per the Payment Schedule mentioned above irrespective of mode of funding i.e., self / bank finance. The PDC's shall be returned to customers in line with disbursements made. If the banker fails to disburse the amount, PDC shall be deposited as per the mentioned dates.</td></tr>
      <tr><td class="center">2</td><td>Installments mentioned above shall be paid as per the work progress on the date of booking - no deviation is allowed.</td></tr>
      <tr><td class="center">3</td><td>All consent letters from the customers addressed to respective banks shall be given at the time of entering into 'AOS' / Tripartite Agreement.</td></tr>
      <tr><td class="center">4</td><td>GST and other taxes if any shall be levied as applicable and as per the rules / laws amended from time to time.</td></tr>
      <tr><td class="center">5</td><td>* GST is Applicable on Cost of Apartment including Amenities, Maintenance Charges &amp; Gaspipeline Charges.</td></tr>
      <tr><td class="center">6</td><td>Registration shall commence on payment of 100% of the Cost of the Apartment.</td></tr>
      <tr><td class="center">7</td><td>Registration charges are subject to changes as per the provisions of registrations act prevailing at the time of registration.</td></tr>
      <tr><td class="center">8</td><td>Bank Charges for realization of out station cheques &amp; Cheque return charges will be recovered from the purchaser's account.</td></tr>
    </table>

    <div class="section-title dark" style="text-align:left;padding:4px 6px">NOTE : PDCS FOR THE AMOUNTS MENTIONED IN ABOVE SCHEDULE TO BE ISSUED IN THE FOLLOWING NAMES:</div>
    <table style="font-size:10.5px">
      <tr><td width="3%">1)</td><td width="27%" class="bold">INSTALLMENTS</td><td width="2%" class="center">:</td><td class="bold">APARNA CONSTRUCTIONS AND ESTATES PRIVATE LIMITED</td></tr>
      <tr><td>2)</td><td class="bold">MAINTENANCE CHARGES</td><td class="center">:</td><td class="bold">APARNA PROPERTY MANAGEMENT SERVICES PVT. LTD</td></tr>
      <tr><td>3)</td><td class="bold">CORPUS FUND &amp; NON-REFUNDABLE DEPOSIT</td><td class="center">:</td><td class="bold">APARNA SYNERGY OWNERS WELFARE SOCIETY</td></tr>
    </table>

    <table class="noborder">
      <tr><td style="border:1px solid #000;text-align:right;padding:6px" class="bold">I/We accept the above terms and conditions</td></tr>
    </table>

    <table style="font-size:11px">
      <tr class="bold">
        <td width="25%" style="border:none;border-top:1px solid #000;padding:18px" class="center">Prepared by</td>
        <td width="25%" style="border:none;border-top:1px solid #000;padding:18px" class="center">Authorized by</td>
        <td width="25%" style="border:none;border-top:1px solid #000;padding:18px" class="center">Approved by</td>
        <td width="25%" style="border:none;border-top:1px solid #000;padding:18px" class="center">Customer/(s) Signature</td>
      </tr>
    </table>
  `;

  document.getElementById("content").innerHTML = html;
  document.getElementById("status").style.display = "none";
  document.getElementById("printBtn").style.display = "inline-block";
}

function init(entityId) {
  // VERIFY this against "Invoke as REST API" in the function's Deluge editor —
  // the string it gives you there is the only thing that goes here.
  const FUNCTION_API_NAME = "getpaymentscheduledata";

  const req_data = { arguments: JSON.stringify({ leadId: entityId }) };
  ZOHO.CRM.FUNCTIONS.execute(FUNCTION_API_NAME, req_data)
    .then(function (data) {
      if (data.code !== "success") {
        showError("Function call failed: " + JSON.stringify(data));
        return;
      }
      const result = data.details.output;
      if (!result || result.status === "error") {
        showError((result && result.message) || "Unknown error from getPaymentScheduleData.");
        return;
      }
      try {
        render(result);
      } catch (e) {
        showError("Error rendering schedule: " + e.message);
      }
    })
    .catch(function (err) {
      showError("Could not run " + FUNCTION_API_NAME + ". (" + JSON.stringify(err) + ")");
    });
}

ZOHO.embeddedApp.on("PageLoad", function (data) {
  const entityId = data.EntityId;
  if (!entityId) {
    showError("No record context found — this widget must run inside a Lead's related list.");
    return;
  }
  init(entityId);
});

ZOHO.embeddedApp.init();
</script>
</body>
</html>
