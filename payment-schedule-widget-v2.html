<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Schedule - cum - Cost Sheet</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Verdana, Arial, Helvetica, sans-serif; font-size: 11px; color: #000; margin: 0; padding: 10px; }
  #status { padding: 20px; text-align: center; color: #555; }
  #error { padding: 16px; background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; border-radius: 4px; margin: 10px 0; display: none; }
  #printBtn { margin-bottom: 10px; padding: 6px 14px; cursor: pointer; }
  @media print { #printBtn { display: none; } }
</style>
</head>
<body>

<div id="status">Loading payment schedule…</div>
<div id="error"></div>
<button id="printBtn" style="display:none" onclick="window.print()">Print</button>
<div id="content"></div>

<script>
// ---- empty-safe formatting: missing/null -> "", real numbers -> "#,##0.00" ----
function fmt(n) {
  if (n === null || n === undefined || n === "" || (typeof n === "number" && isNaN(n))) return "";
  return Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function txt(v) {
  return (v === null || v === undefined) ? "" : v;
}
function showError(msg) {
  document.getElementById("status").style.display = "none";
  const el = document.getElementById("error");
  el.style.display = "block";
  el.textContent = msg;
}

function buildRowsHtml(rows) {
  if (!rows || rows.length === 0) return "";
  return rows.map(r => `
    <tr>
      <td style="border:1px solid #000;text-align:center">${txt(r.no)}</td>
      <td style="border:1px solid #000">${txt(r.date)}</td>
      <td style="border:1px solid #000${r.no === 11 ? ';font-weight:bold' : ''}">${txt(r.desc)}</td>
      <td style="border:1px solid #000;text-align:center">${r.uvPercent !== undefined && r.uvPercent !== null ? r.uvPercent + "%" : ""}</td>
      <td style="border:1px solid #000;text-align:right">${fmt(r.amount)}</td>
      <td style="border:1px solid #000;text-align:center">${r.tdsPercent !== undefined && r.tdsPercent !== null ? r.tdsPercent + "%" : ""}</td>
      <td style="border:1px solid #000;text-align:right">${fmt(r.tdsAmount)}</td>
      <td style="border:1px solid #000;text-align:right">${fmt(r.developerAmount)}</td>
      <td style="border:1px solid #000;text-align:center">${r.gstPercent !== undefined && r.gstPercent !== null ? r.gstPercent + "%" : ""}</td>
      <td style="border:1px solid #000;text-align:right">${fmt(r.gstAmount)}</td>
      <td style="border:1px solid #000;text-align:right">${fmt(r.payableAmount)}</td>
    </tr>`).join("");
}

function render(result) {
  const c = result.customer || {};
  const u = result.unit || {};
  const rows = result.rows || [];
  const tA = result.totalsA || {};
  const b = result.sectionB || {};

          <tr>

            <td style="border:1px solid #000;text-align:right">${fmt(u.cornerCharge)}</td>
          </tr>
          <tr>
            <td style="border:1px solid #000;font-weight:bold">Floor</td>
            <td style="border:1px solid #000;text-align:center">:</td>

            <td style="border:1px solid #000;text-align:right;font-weight:bold">${fmt(u.basicUnitValue)}</td>
          </tr>

            <td style="border:1px solid #000;text-align:center">:</td>
            <td style="border:1px solid #000;text-align:center">${txt(u.parking)}</td>
            <td style="border:1px solid #000">Charges for Amenities</td>
            <td style="border:1px solid #000;text-align:center">:</td>

          </tr>

    </td></tr>

    <tr>

        <span style="font-size:20px;font-weight:bold">PAYMENT SCHEDULE</span>
      </td>
    </tr>

    <tr><td colspan="3" style="padding:0;border:none">
      <table width="100%" cellpadding="4" cellspacing="0" style="border-collapse:collapse;font-size:10.5px">
        <tbody>
          <tr style="font-weight:bold;text-align:center">
            <td width="4%" style="border:1px solid #000">S.No</td>
            <td width="7%" style="border:1px solid #000">DATE</td>
            <td width="27%" style="border:1px solid #000">Description of Payments</td>
            <td width="5%" style="border:1px solid #000">UV %</td>
            <td width="10%" style="border:1px solid #000">Instalment Amount Payable</td>
            <td width="5%" style="border:1px solid #000">TDS</td>
            <td width="9%" style="border:1px solid #000">TDS to be Remitted through Traces of Purchaser(s)</td>
            <td width="10%" style="border:1px solid #000">Amount payable to Developer (excl. TDS)</td>

            <td width="10%" style="border:1px solid #000">Instalment Amount payable to Developer (incl. GST, excl. TDS)</td>
          </tr>
          ${buildRowsHtml(rows)}
          <tr style="font-weight:bold;text-align:center">
            <td colspan="3" style="border:1px solid #000">TOTAL - A</td>
            <td style="border:1px solid #000">100%</td>
            <td style="border:1px solid #000;text-align:right">${fmt(tA.amount)}</td>
            <td style="border:1px solid #000"></td>
            <td style="border:1px solid #000;text-align:right">${fmt(tA.tdsAmount)}</td>
            <td style="border:1px solid #000;text-align:right">${fmt(tA.developerAmount)}</td>
            <td style="border:1px solid #000"></td>
            <td style="border:1px solid #000;text-align:right">${fmt(tA.gstAmount)}</td>
            <td style="border:1px solid #000;text-align:right">${fmt(tA.payableAmount)}</td>

    </tr>

            <td width="14%" style="border:1px solid #000;text-align:right">${fmt(b.legalCharge)}</td>

        </tbody>

function init(entityId) {
  const req_data = { arguments: JSON.stringify({ leadId: entityId }) };
  ZOHO.CRM.FUNCTIONS.execute("getPaymentScheduleData", req_data)
    .then(function (data) {
      const result = data.details.output;
      if (!result || result.status === "error") {
        showError((result && result.message) || "Could not load the payment schedule.");
        return;
      }
      try {
        render(result);
      } catch (e) {
        showError("Error rendering schedule: " + e.message);
      }
    })
    .catch(function (err) {
      showError("Could not run getPaymentScheduleData. (" + JSON.stringify(err) + ")");
    });
}

ZOHO.embeddedApp.on("PageLoad", function (data) {
  const entityId = data.EntityId;
  if (!entityId) {
    showError("No record context found — this widget must run inside a Lead's related list.");
    return;
  }
  init(entityId);
});

ZOHO.embeddedApp.init();
