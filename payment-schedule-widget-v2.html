<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cost Estimate</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #000; margin: 0; padding: 10px; }
  #status { padding: 20px; text-align: center; color: #555; }
  #error { padding: 16px; background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; border-radius: 4px; margin: 10px 0; display: none; }
  #printBtn { margin-bottom: 10px; padding: 6px 14px; cursor: pointer; }
  #mailBtn { margin-bottom: 10px; margin-left: 6px; padding: 6px 14px; cursor: pointer; }
  @media print { #printBtn, #mailBtn { display: none; } }
</style>
</head>
<body>

<div id="status">Loading cost estimate…</div>
<div id="error"></div>
<button id="printBtn" style="display:none" onclick="window.print()">Print</button>
<button id="mailBtn" style="display:none" onclick="sendCostSheet()">Email to customer</button>
<div id="content"></div>

<script>
const TEST_MODE = true;                        // set to false for production
const TEST_EMAIL = "sankarnaveen622@gmail.com";

// ---- empty-safe helpers ----
function isEmpty(n) { return n === null || n === undefined || n === "" || (typeof n === "number" && isNaN(n)); }
function txt(v) { return (v === null || v === undefined) ? "" : v; }
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
// Amounts follow the sheet format: whole numbers, zero shown as "-", empty stays empty
function amt(n) {
  if (isEmpty(n)) return "";
  const v = Number(n);
  if (v === 0) return "-";
  return v.toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
// Rates / areas: up to 2 decimals, no forced trailing zeros
function dec(n) {
  if (isEmpty(n)) return "";
  return Number(n).toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function rate(amount, area) {
  const a = num(area);
  if (a <= 0 || isEmpty(amount)) return "";
  return num(amount) / a;
}
function todayStr() {
  const d = new Date();
  const p = x => String(x).padStart(2, "0");
  return p(d.getDate()) + "-" + p(d.getMonth() + 1) + "-" + d.getFullYear();
}
function showError(msg) {
  document.getElementById("status").style.display = "none";
  const el = document.getElementById("error");
  el.style.display = "block";
  el.textContent = msg;
}

const B = "border:1px solid #000;";
const TERMS = [
  "The Price / Cost Estimate provided herein is subject to change without prior notice. The price prevailing on the date of booking shall be final.",
  "GST is Applicable on Cost of Apartment including Amenities, Maintenance Charges & other Charges as applicable.",
  "GST, Taxes and other levies shall be levied as per the rules / laws of respective acts which are as applicable and amended from time to time",
  "The Purchaser(s)/Allottee(s) is solely responsible for deduction of TDS @ 1% (subject to change as per the IT Act, 2025) on each instalment receivable by us.",
  "Registration shall commence only on clearance of total 100% of the Cost of the Apartment including all other charges as the case maybe.",
  "Registration, Stamp Duty, Mutation and other charges / levies are subject to changes as per the provisions of registrations act prevailing at the time of registration.",
  "The Payment by way of Debit / Credit Card Swipping for clearance of Token Advance is restricted to Rs.2,00,000/- (Rupees Two Lakhs only) and no Bank Charges shall be recovered up for the payments up to Rs.2,00,000/- (Rupees Two Lakhs only). Bank Charges will be applicable and recovered for payments over and above the payment of Rs.2,00,000/- (Rupees Two Lakhs only).",
  "Bank Charges for realization of Out station cheques & Cheque return charges will be debited and recovered from the purchaser's account. International Cheques are not accepted.",
  "Other terms and conditions shall apply as per the Booking Application form and Agreement of Sale.",
  "The Promoter/Developer reserves the right and at its discretion may accept or reject this Booking Application Form from the Applicant(s) without providing any reasons of rejection with mere notice of intimation for rejection."
];

// section heading row
function head(label, color) {
  return `<tr><td colspan="4" style="${B}text-align:center;font-weight:bold;padding:5px;${color ? "color:" + color + ";" : ""}">${label}</td></tr>`;
}
// label | rate | : | amount
function line(label, rateVal, value, opts) {
  opts = opts || {};
  return `<tr>
    <td style="${B}padding:4px 6px">${label}</td>
    <td style="${B}width:14%;text-align:right;padding:4px 6px">${rateVal}</td>
    <td style="${B}width:3%;text-align:center">:</td>
    <td style="${B}width:20%;text-align:right;padding:4px 6px">${value}</td>
  </tr>`;
}
// bold, centered total row
function total(label, value, color) {
  const c = color ? "color:" + color + ";" : "";
  return `<tr style="font-weight:bold">
    <td colspan="2" style="${B}text-align:center;padding:5px;${c}">${label}</td>
    <td style="${B}text-align:center">:</td>
    <td style="${B}text-align:right;padding:4px 6px;${c}">${value}</td>
  </tr>`;
}

function render(result) {
  const u = result.unit || {};
  const b = result.sectionB || {};
  const cc = result.sectionC || {};

  const builtUp = num(u.builtUpArea);
  const diffArea = num(u.diffBuiltUpArea);
  const totalArea = !isEmpty(u.totalSaleableArea) ? num(u.totalSaleableArea) : builtUp + diffArea;

  // --- Section A: unit value. GST on unit value is intentionally left empty. ---
  const unitValue = !isEmpty(u.totalUnitValue)
    ? num(u.totalUnitValue)
    : num(u.basicUnitValue) + num(u.amenitiesCharge) + num(u.gasPipeline);
  const gstOnUnit = null;                              // left empty
  const totalA = unitValue + num(gstOnUnit);

  // --- Section B: other charges (all incl. GST) ---
  const legal = num(b.total);
  const maintenance = num(cc.maintenanceTotal);
  const corpus = num(cc.corpus);
  const refDep = num(cc.refDeposit);
  const nonRefDep = num(cc.nonRefDeposit);
  const totalB = legal + maintenance + corpus + refDep + nonRefDep;
  const grand = totalA + totalB;

  const termsHtml = TERMS.map((t, i) => `
    <tr>
      <td style="${B}width:5%;text-align:center;padding:4px">${i + 1}</td>
      <td style="${B}padding:4px 6px">${t}</td>
    </tr>`).join("");

  const html = `
  <div style="font-family: Arial, Helvetica, sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:900px;border-collapse:collapse;border:1px solid #000;font-size:12px;color:#000;margin:0 auto">
    <tbody>
      <tr>
        <td style="${B}text-align:center;padding:10px">
          <span style="font-size:18px;font-weight:bold;color:#ff0000">COST ESTIMATE</span>
        </td>
      </tr>
      <tr>
        <td style="${B}text-align:right;padding:4px 6px">${todayStr()}</td>
      </tr>
      <tr>
        <td style="${B}padding:5px 6px;font-weight:bold;color:#0070c0;font-size:13px">PROJECT&nbsp;&nbsp;&nbsp;&nbsp;${txt(u.project)}</td>
      </tr>

      <tr><td style="padding:0;border:none">
        <table width="100%" cellpadding="4" cellspacing="0" style="border-collapse:collapse;font-size:12px">
          <tbody>
            <tr><td colspan="7" style="${B}text-align:center;font-weight:bold">APARTMENT PARTICULARS</td></tr>
            <tr>
              <td width="22%" style="${B}">Block</td><td width="3%" style="${B}text-align:center">:</td><td width="25%" style="${B}">${txt(u.block)}</td>
              <td width="4%" style="border:none"></td>
              <td width="22%" style="${B}">CAR PARKING(S)</td><td width="3%" style="${B}text-align:center">:</td><td width="21%" style="${B}">${txt(u.parking)}</td>
            </tr>
            <tr>
              <td style="${B}">Floor</td><td style="${B}text-align:center">:</td><td style="${B}">${txt(u.floor)}</td>
              <td style="border:none"></td>
              <td style="${B}">Facing</td><td style="${B}text-align:center">:</td><td style="${B}">${txt(u.facing)}</td>
            </tr>
            <tr>
              <td style="${B}">Apartment No.</td><td style="${B}text-align:center">:</td><td style="${B}">${txt(u.apartmentNo)}</td>
              <td style="border:none"></td>
              <td style="${B}">Type</td><td style="${B}text-align:center">:</td><td style="${B}">${txt(u.type)}</td>
            </tr>
          </tbody>
        </table>
      </td></tr>

      <tr><td style="padding:0;border:none">
        <table width="100%" cellpadding="4" cellspacing="0" style="border-collapse:collapse;font-size:12px">
          <tbody>
            ${head("SALEABLE AREA PARTICULARS")}
            ${line("Built-up Area (in Sq.Ft.)", "", dec(builtUp))}
            ${line("Differential Built-up Area (in Sq.Ft.)", "", dec(diffArea))}
            <tr style="font-weight:bold">
              <td colspan="2" style="${B}text-align:center;padding:5px">TOTAL SALEABLE AREA (IN SQ. FT.)</td>
              <td style="${B}text-align:center">:</td>
              <td style="${B}text-align:right;padding:4px 6px">${dec(totalArea)}</td>
            </tr>

            ${head("COST ESTIMATE PARTICULARS")}
            ${line("Basic Price for Built-up Area", dec(rate(u.basicPriceBuiltup, builtUp)), amt(u.basicPriceBuiltup))}
            ${line("Basic Price for Differential Built-up Area", dec(rate(u.basicPriceDiff, diffArea)), amt(u.basicPriceDiff))}
            ${line("Charges for Floor Rise", dec(rate(u.floorRiseCharge, totalArea)), amt(u.floorRiseCharge))}
            ${line("Charges for East / North Facing", dec(rate(u.facingCharge, totalArea)), amt(u.facingCharge))}
            ${line("Charges for Corner Preference", dec(rate(u.cornerCharge, totalArea)), amt(u.cornerCharge))}
            ${line("Charges for Internal / Park View", dec(rate(u.viewCharge, totalArea)), amt(u.viewCharge))}
            ${line("Charges for Shifting", dec(rate(u.shiftingCharge, totalArea)), amt(u.shiftingCharge))}
            ${line("Charges for Amenities", dec(rate(u.amenitiesCharge, totalArea)), amt(u.amenitiesCharge))}
            ${line("Gas Pipeline charges", "Fixed", amt(u.gasPipeline))}
            ${total("ESTIMATED UNIT VALUE INCLUDING AMENITIES", amt(unitValue), "#0070c0")}
            <tr>
              <td colspan="2" style="${B}text-align:center;padding:5px">GST ON UNIT VALUE INCLUDING AMENITIES - ( NIL AS OC RECEIVED)</td>
              <td style="${B}text-align:center">:</td>
              <td style="${B}text-align:right;padding:4px 6px">${amt(gstOnUnit)}</td>
            </tr>
            ${total("ESTIMATED TOTAL UNIT VALUE INCLUDING GST - (A)", amt(totalA), "#0070c0")}

            ${head("ESTIMATE OF OTHER CHARGES")}
            ${line("Legal &amp; Documentation Charges incl. GST", "", amt(legal))}
            ${line("Charges towards Common Area Maintenance for 2 years including GST", "", amt(maintenance))}
            ${line("Corpus Fund", "", amt(corpus))}
            ${line("Refundable Caution Deposit", "", amt(refDep))}
            ${line("Non-refundable Caution Deposit", "", amt(nonRefDep))}
            ${total("ESTIMATED TOTAL UNIT VALUE INCLUDING GST - (B)", amt(totalB), "#0070c0")}
            ${total("ESTIMATED TOTAL UNIT VALUE INCLUDING GST &amp; OTHER CHARGES - (A+B)", amt(grand), "#ff0000")}
          </tbody>
        </table>
      </td></tr>

      <tr><td style="padding:0;border:none">
        <table width="100%" cellpadding="4" cellspacing="0" style="border-collapse:collapse;font-size:12px">
          <tbody>
            <tr><td colspan="2" style="${B}text-align:center;font-weight:bold;color:#ff0000;padding:5px">TERMS AND CONDITIONS</td></tr>
            ${termsHtml}
          </tbody>
        </table>
      </td></tr>
    </tbody>
  </table>
  </div>`;

  document.getElementById("content").innerHTML = html;
  document.getElementById("status").style.display = "none";
  document.getElementById("printBtn").style.display = "inline-block";
  window.__result = result;
  document.getElementById("mailBtn").style.display = "inline-block";
}

async function sendCostSheet() {
  const btn = document.getElementById("mailBtn");
  const c = (window.__result && window.__result.customer) || {};
  const u = (window.__result && window.__result.unit) || {};
  if (!c.email) { alert("No email address (EMAIL ADDRESS 1) on this lead."); return; }

  const recipient = TEST_MODE ? TEST_EMAIL : c.email;
  if (!confirm("Send the cost estimate to " + recipient + "?")) return;

  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    // Full standalone HTML file, minified (whitespace between tags removed) to keep the payload small
    const bodyHtml = document.getElementById("content").innerHTML
      .replace(/>\s+</g, "><")
      .replace(/\s{2,}/g, " ")
      .trim();
    const fullHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cost Estimate</title></head><body>' + bodyHtml + '</body></html>';

    const subject = (TEST_MODE ? "[TEST] " : "") + "Cost Estimate - " + txt(c.name) + (u.apartmentNo ? " - " + u.apartmentNo : "");

    const req_data = {
      arguments: JSON.stringify({
        leadId: String(window.__leadId),
        toEmail: recipient,
        subjects: subject,
        fileName: "Cost_Estimate_" + (txt(u.apartmentNo) || "Unit") + ".html",
        html: fullHtml
      })
    };

    const data = await ZOHO.CRM.FUNCTIONS.execute("quotstest", req_data);
    console.log("quotstest response:", data);

    let out = data && data.details ? data.details.output : null;
    if (typeof out === "string") { try { out = JSON.parse(out); } catch (e) {} }
    if (out && out.status === "error") throw new Error(out.message || "Deluge function returned an error");

    alert("Cost estimate sent to " + recipient);
  } catch (e) {
    console.error(e);
    alert("Could not send email: " + (e && e.message ? e.message : JSON.stringify(e)));
  } finally {
    btn.disabled = false;
    btn.textContent = "Email to customer";
  }
}

function init(entityId) {
  const req_data = { arguments: JSON.stringify({ leadId: entityId }) };
  ZOHO.CRM.FUNCTIONS.execute("detailsforwidget", req_data)
    .then(function (data) {
      let result = data.details.output;
      if (typeof result === "string") {
        try { result = JSON.parse(result); }
        catch (e) { showError("Could not parse response from detailsforwidget: " + e.message); return; }
      }
      if (!result || result.status === "error") {
        showError((result && result.message) || "Could not load the cost estimate.");
        return;
      }
      try { render(result); }
      catch (e) { showError("Error rendering cost estimate: " + e.message); }
    })
    .catch(function (err) {
      showError("Could not run detailsforwidget. (" + JSON.stringify(err) + ")");
    });
}

ZOHO.embeddedApp.on("PageLoad", function (data) {
  const entityId = data.EntityId;
  if (!entityId) {
    showError("No record context found — this widget must run inside a Lead's related list.");
    return;
  }
  window.__leadId = entityId;
  init(entityId);
});

ZOHO.embeddedApp.init();
</script>
</body>
</html>
