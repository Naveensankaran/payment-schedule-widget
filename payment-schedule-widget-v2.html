<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Schedule</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #000; margin: 0; padding: 10px; }
  #status { padding: 20px; text-align: center; color: #555; }
  #error { padding: 16px; background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; border-radius: 4px; margin: 10px 0; display: none; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
  td, th { border: 1px solid #000; padding: 4px; }
  .center { text-align: center; }
  .right { text-align: right; }
  .bold { font-weight: bold; }
  .section-title { text-align: center; padding: 6px 0; font-weight: bold; background: #f0f0f0; }
  .grand-total { border-top: 3px double #000; border-bottom: 3px double #000; text-align: center; padding: 8px 4px; font-size: 13px; font-weight: bold; }
  #printBtn { margin-bottom: 10px; padding: 6px 14px; cursor: pointer; }
  @media print {
    #printBtn { display: none; }
  }
</style>
</head>
<body>

<div id="status">Loading payment schedule…</div>
<div id="error"></div>
<button id="printBtn" style="display:none" onclick="window.print()">Print</button>
<div id="content"></div>

<script>
// ============================================================
// CONFIG — verify every field/module API name against your org
// (Setup > Developer Hub > APIs and SDKs) before relying on this.
// Names below are best guesses from the template's display labels.
// ============================================================
const CONFIG = {
  unitLookupApiName: "Unit",       // lookup field on Leads pointing to the Unit record
  unitModuleApiName: "Products",   // per your earlier confirmation: "Unit" tab = API name "Products"

  leadFields: {
    name: "Full_Name",
    phone: "Phone",
    phone2: "Secondary_Phone",
    email: "Email",
    email2: "Secondary_Email",
    bookingDate: "Booking_Date",
    tower: "Tower_test",   // matches the "${Leads.Tower  test}" tag you had
    floor: "floor_test"    // matches "${Leads.floor test}"
  },

  unitFields: {
    allInclusivePrice: "All_Inclusive_Price",
    basePrice: "Base_Price",
    differentialBuiltUpArea: "Differential_Built_Up_Area",
    builtUpArea: "Built_Up_Area",
    floorRise: "Floor_Rise",
    facingCharges: "Unit_Facing_Charges",
    cornerCharges: "Corner_Facing_Charges",
    viewCharges: "Charges_For_View",
    shiftingCharges: "Charges_For_Shifting",
    uds: "Uds",
    parkingCount: "Parking_Count",
    facingDirection: "Unit_Facing_Direction",
    amenitiesPrice: "Amenities_Price_Sft",
    gasPipeline: "Gas_Pipeline_Charges",
    unitConfigName: "Unit_Configuration_Name"
  },

  policy: {
    tdsRate: 0.01,
    gstRate: 0.05,             // GST on each Section-A instalment
    legalDocCharges: 25000,    // Section B — adjust as needed
    legalDocGstRate: 0.18,
    maintenanceRatePerSqft: 96,
    maintenanceGstRate: 0.18,
    corpusFund: 100000,        // Section C — adjust as needed
    nonRefundableDeposit: 20000,
    refundableDeposit: 30000
  },

  schedule: [
    { no: 1,  desc: "Booking Advance of 10% of Unit Value - Payable within 15 days from the date of Booking (for execution of AOS)", pct: 0.10 },
    { no: 2,  desc: "1st Instalment irrespective of Self / Bank Funding", pct: 0.073 },
    { no: 3,  desc: "2nd Instalment irrespective of Self / Bank Funding", pct: 0.073 },
    { no: 4,  desc: "3rd Instalment irrespective of Self / Bank Funding", pct: 0.073 },
    { no: 5,  desc: "4th Instalment irrespective of Self / Bank Funding", pct: 0.073 },
    { no: 6,  desc: "5th Instalment irrespective of Self / Bank Funding", pct: 0.073 },
    { no: 7,  desc: "6th Instalment irrespective of Self / Bank Funding", pct: 0.073 },
    { no: 8,  desc: "7th Instalment irrespective of Self / Bank Funding", pct: 0.073 },
    { no: 9,  desc: "8th Instalment irrespective of Self / Bank Funding", pct: 0.073 },
    { no: 10, desc: "9th Instalment irrespective of Self / Bank Funding", pct: 0.266 },
    { no: 11, desc: "Handing Over of respective Apartment", pct: 0.05, bold: true }
  ]
};

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return "";
  return Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function pctLabel(p) {
  const v = p * 100;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + "%";
}
function showError(msg) {
  document.getElementById("status").style.display = "none";
  const el = document.getElementById("error");
  el.style.display = "block";
  el.textContent = msg;
}

function computeSchedule(allInclusivePrice) {
  const { tdsRate, gstRate } = CONFIG.policy;
  let rows = [];
  let totals = { amt: 0, tds: 0, dev: 0, gst: 0, pay: 0 };

  CONFIG.schedule.forEach(row => {
    const amt = allInclusivePrice * row.pct;
    const tds = amt * tdsRate;
    const dev = amt - tds;
    const gst = amt * gstRate;
    const pay = dev + gst;
    totals.amt += amt; totals.tds += tds; totals.dev += dev; totals.gst += gst; totals.pay += pay;
    rows.push({ ...row, amt, tds, dev, gst, pay });
  });

  return { rows, totals };
}

function render(leadData, unitData) {
  const uf = CONFIG.unitFields;
  const lf = CONFIG.leadFields;
  const pol = CONFIG.policy;

  const allInclusivePrice = parseFloat(unitData[uf.allInclusivePrice]) || 0;
  const builtUpArea = parseFloat(unitData[uf.builtUpArea]) || 0;

  const { rows, totals } = computeSchedule(allInclusivePrice);

  // Section B
  const legalAmt = pol.legalDocCharges;
  const legalGst = legalAmt * pol.legalDocGstRate;
  const legalTotal = legalAmt + legalGst;

  // Section C
  const maintAmt = builtUpArea * pol.maintenanceRatePerSqft;
  const maintGst = maintAmt * pol.maintenanceGstRate;
  const maintTotal = maintAmt + maintGst;
  const totalCAmt = maintAmt + pol.corpusFund + pol.nonRefundableDeposit + pol.refundableDeposit;
  const totalCGst = maintGst;
  const totalC = totalCAmt + totalCGst;

  const grandTotal = totals.pay + totals.tds + legalTotal + totalC;

  let rowsHtml = rows.map(r => `
    <tr>
      <td class="center">${r.no}</td>
      <td></td>
      <td${r.bold ? ' class="bold"' : ''}>${r.desc}</td>
      <td class="center">${pctLabel(r.pct)}</td>
      <td class="right">${fmt(r.amt)}</td>
      <td class="center">1%</td>
      <td class="right">${fmt(r.tds)}</td>
      <td class="right">${fmt(r.dev)}</td>
      <td class="center">5%</td>
      <td class="right">${fmt(r.gst)}</td>
      <td class="right">${fmt(r.pay)}</td>
    </tr>`).join("");

  const html = `
    <table>
      <tr>
        <td style="width:35%"><b>NAME OF THE CUSTOMER</b>: ${leadData[lf.name] || ""}</td>
        <td style="width:35%"><b>DATE OF BOOKING</b>: ${leadData[lf.bookingDate] || ""}</td>
        <td style="width:30%"><b>Built-up Area (Sq.Ft.)</b>: ${fmt(builtUpArea)}</td>
      </tr>
      <tr>
        <td><b>CONTACT</b>: ${leadData[lf.phone] || ""}</td>
        <td><b>EMAIL</b>: ${leadData[lf.email] || ""}</td>
        <td><b>TOTAL UNIT VALUE (Incl. Amenities &amp; Gas)</b>: Rs. ${fmt(allInclusivePrice)}</td>
      </tr>
    </table>

    <div class="section-title" style="font-size:16px">PAYMENT SCHEDULE</div>
    <table>
      <tr class="bold center">
        <td>S.No</td><td>DATE</td><td>Description of Payments</td><td>UV %</td>
        <td>Instalment Amount Payable</td><td>TDS</td>
        <td>TDS to be Remitted through Traces of Purchaser(s)</td>
        <td>Amount payable to Developer (excl. TDS)</td><td>GST %</td>
        <td>GST Amount Payable to Developer on each instalment</td>
        <td>Instalment Amount payable to Developer (incl. GST, excl. TDS)</td>
      </tr>
      ${rowsHtml}
      <tr class="bold center">
        <td colspan="3">TOTAL - A</td>
        <td>100%</td>
        <td class="right">${fmt(totals.amt)}</td>
        <td></td>
        <td class="right">${fmt(totals.tds)}</td>
        <td class="right">${fmt(totals.dev)}</td>
        <td></td>
        <td class="right">${fmt(totals.gst)}</td>
        <td class="right">${fmt(totals.pay)}</td>
      </tr>
    </table>

    <div class="section-title">AMOUNT PAYABLE AT THE TIME OF REGISTRATION OF APARTMENT</div>
    <table>
      <tr>
        <td class="center" style="width:6%">12</td>
        <td style="width:50%">Legal and Documentation Charges</td>
        <td class="right" style="width:14%">${fmt(legalAmt)}</td>
        <td class="center" style="width:8%">18%</td>
        <td class="right" style="width:10%">${fmt(legalGst)}</td>
        <td class="right bold" style="width:12%">${fmt(legalTotal)}</td>
      </tr>
      <tr class="bold">
        <td colspan="5">TOTAL - B (Excluding Registration / Stamp Duty &amp; Mutation Charges)</td>
        <td class="right">${fmt(legalTotal)}</td>
      </tr>
    </table>

    <div class="section-title">AMOUNTS PAYABLE AT THE TIME OF HANDING OVER OF APARTMENT</div>
    <table>
      <tr class="bold center">
        <td style="width:6%">Sl.No</td><td style="width:50%">Particulars</td>
        <td style="width:14%">Amount Payable</td><td style="width:8%">GST %</td>
        <td style="width:10%">GST Amount</td><td style="width:12%">Amount Payable incl. GST</td>
      </tr>
      <tr>
        <td class="center">13</td>
        <td>Maintenance for 2 years @ Rs. 96/- per Sq.ft &amp; GST @ 18%</td>
        <td class="right">${fmt(maintAmt)}</td>
        <td class="center">18%</td>
        <td class="right">${fmt(maintGst)}</td>
        <td class="right">${fmt(maintTotal)}</td>
      </tr>
      <tr>
        <td class="center">14</td><td>Corpus Fund</td>
        <td class="right">${fmt(pol.corpusFund)}</td>
        <td class="center">-</td><td class="right">-</td>
        <td class="right">${fmt(pol.corpusFund)}</td>
      </tr>
      <tr>
        <td class="center">15</td><td>Non-refundable Caution Deposit</td>
        <td class="right">${fmt(pol.nonRefundableDeposit)}</td>
        <td class="center">-</td><td class="right">-</td>
        <td class="right">${fmt(pol.nonRefundableDeposit)}</td>
      </tr>
      <tr>
        <td class="center">16</td><td>Refundable Caution Deposit</td>
        <td class="right">${fmt(pol.refundableDeposit)}</td>
        <td class="center">-</td><td class="right">-</td>
        <td class="right">${fmt(pol.refundableDeposit)}</td>
      </tr>
      <tr class="bold center">
        <td colspan="2">TOTAL - C</td>
        <td class="right">${fmt(totalCAmt)}</td>
        <td></td>
        <td class="right">${fmt(totalCGst)}</td>
        <td class="right">${fmt(totalC)}</td>
      </tr>
    </table>

    <div class="grand-total">
      GRAND TOTAL (A + B + C) — Including TDS / Excluding Registration, Stamp Duty &amp; Mutation Charges&nbsp;:&nbsp;
      Rs. ${fmt(grandTotal)}
    </div>
  `;

  document.getElementById("content").innerHTML = html;
  document.getElementById("status").style.display = "none";
  document.getElementById("printBtn").style.display = "inline-block";
}

function init(entityId) {
  ZOHO.CRM.API.getRecord({ Entity: "Leads", RecordID: entityId })
    .then(function (leadResp) {
      const leadData = leadResp.data[0];
      const unitLookup = leadData[CONFIG.unitLookupApiName];

      if (!unitLookup || !unitLookup.id) {
        showError("This Lead has no Unit linked yet — the payment schedule needs a Unit to calculate from.");
        return;
      }

      ZOHO.CRM.API.getRecord({ Entity: CONFIG.unitModuleApiName, RecordID: unitLookup.id })
        .then(function (unitResp) {
          const unitData = unitResp.data[0];
          try {
            render(leadData, unitData);
          } catch (e) {
            showError("Error rendering schedule — check CONFIG field names match your org. (" + e.message + ")");
          }
        })
        .catch(function (err) {
          showError("Could not fetch the Unit record — check CONFIG.unitModuleApiName. (" + JSON.stringify(err) + ")");
        });
    })
    .catch(function (err) {
      showError("Could not fetch the Lead record. (" + JSON.stringify(err) + ")");
    });
}

ZOHO.embeddedApp.on("PageLoad", function (data) {
  const entityId = data.EntityId;
  if (!entityId) {
    showError("No record context found — this widget must run inside a Lead's related list.");
    return;
  }
  init(entityId);
});

ZOHO.embeddedApp.init();
</script>
</body>
</html>
